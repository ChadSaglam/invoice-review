[project]
name = "invoice_review"
version = "0.1.0"
description = "invoice-review using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.9.3",
    "litellm>=1.75.3",
]

[project.scripts]
invoice_review = "invoice_review.main:run"
run_crew = "invoice_review.main:run"
train = "invoice_review.main:train"
replay = "invoice_review.main:replay"
test = "invoice_review.main:test"
run_with_trigger = "invoice_review.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
